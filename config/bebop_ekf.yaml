### robot_localization — EKF para Bebop indoor (3D completo)
### Un único sensor: /bebop/fullodom
### TF publicado por este nodo: odom → bebop_link

bebop_ekf:
  ros__parameters:

    # ── Frames ────────────────────────────────────────────────
    world_frame:     odom
    odom_frame:      odom
    base_link_frame: bebop_link
    map_frame:       map

    # ── TF ────────────────────────────────────────────────────
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.0

    # ── Frecuencia ────────────────────────────────────────────
    frequency: 15.0

    # ── Modo 3D ───────────────────────────────────────────────
    two_d_mode: false

    # ── Comportamiento ────────────────────────────────────────
    print_diagnostics: true
    debug: false
    gravitational_acceleration: 9.80665

    # ── Fuente de odometría ───────────────────────────────────
    odom0: /bebop/fullodom

    # Orden: x  y  z  roll  pitch  yaw  vx  vy  vz  vroll  vpitch  vyaw
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, true]

    odom0_differential: false
    odom0_relative:     false
    odom0_queue_size:   1
    odom0_nodelay:      true

    # ── Ruido de proceso Q — lista plana 15×15 = 225 valores ──
    # Orden estados: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
